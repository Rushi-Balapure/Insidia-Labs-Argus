# crAPI publishes host ports and pins container_name. This file attaches every
# service to the harness network (created with --internal) and drops both.
networks:
  sandbox:
    name: ${INSIDIA_SANDBOX_NETWORK:?must be set}
    external: true

services:
  crapi-identity:
    container_name: ${INSIDIA_BENCH_PROJECT:?must be set}-crapi-identity
    ports: !override []
    networks: !override
      - sandbox
    labels:
      insidia.benchmark: "1"
      insidia.benchmark.project: ${INSIDIA_BENCH_PROJECT:?must be set}

  crapi-community:
    container_name: ${INSIDIA_BENCH_PROJECT:?must be set}-crapi-community
